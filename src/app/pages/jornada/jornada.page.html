<div class="mx-auto max-w-5xl min-h-screen bg-gray-50 p-6">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Jornada del día</h1>

    @if (puedeCerrar) {
      <button
        type="button"
        class="cursor-pointer rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-700 active:bg-red-800 transition-colors"
        (click)="abrirModalCierre()"
      >Cerrar jornada</button>
    }
  </div>

  @if (error()) {
    <app-error-alert [message]="error()!" />
  }

  @if (cargando()) {
    <div class="flex justify-center py-12">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-gray-300 border-t-blue-600" role="status">
        <span class="sr-only">Cargando...</span>
      </div>
    </div>
  } @else if (jornada(); as j) {
    <app-jornada-summary-card [jornada]="j" />
  } @else if (!error()) {
    <app-empty-state message="No hay jornada abierta. Inicia el día para comenzar." />
  }
</div>

@if (showCloseModal()) {
  <div
    class="fixed inset-0 z-50 flex cursor-pointer items-center justify-center bg-black/40"
    role="dialog"
    tabindex="-1"
    (click)="onBackdropClick($event)"
    (keydown)="onModalKeydown($event)"
  >
    <div
      class="mx-4 w-full max-w-md rounded-xl bg-white p-6 shadow-xl"
    >
      <h3 class="mb-4 text-lg font-semibold text-gray-900">Cerrar jornada</h3>

      @if (cerrarError()) {
        <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ cerrarError() }}
        </div>
      }

      <div class="mb-4">
        <label for="saldo-real" class="mb-1 block text-sm font-medium text-gray-700">
          Saldo real ($)
        </label>
        <input
          id="saldo-real"
          type="text"
          inputmode="numeric"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-lg font-medium text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          [class.border-red-400]="cerrarError()"
          placeholder="0"
          (input)="onSaldoRealChange($any($event.target).value)"
          (keydown)="onModalKeydown($event)"
        />
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          class="flex-1 cursor-pointer rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
          [disabled]="cerrando()"
          (click)="cerrarModalCierre()"
        >Cancelar</button>
        <button
          type="button"
          class="flex-1 cursor-pointer rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700 active:bg-red-800 transition-colors disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="cerrando() || saldoReal() === null"
          (click)="confirmarCierre()"
        >
          @if (cerrando()) {
            <span class="inline-flex items-center gap-2">
              <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
              Cerrando...
            </span>
          } @else {
            Cerrar y descargar
          }
        </button>
      </div>
    </div>
  </div>
}
