<div class="min-h-screen bg-gray-50 p-6">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Jornada del día</h1>

  @if (error) {
    <app-error-alert [message]="error" />
  }

  @if (jornada; as j) {
    <app-jornada-summary-card [jornada]="j" />
  } @else if (!error) {
    <app-empty-state message="No hay jornada abierta. Iniciá el día para comenzar." />
  }
</div>
