<div class="flex items-center justify-center min-h-screen bg-gray-50 dark:bg-gray-950 p-4 safe-top safe-bottom">
  <div class="w-full max-w-sm bg-white dark:bg-gray-900 rounded-lg shadow-lg dark:shadow-gray-950/50 p-6 sm:p-8">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-900 dark:text-gray-100">Mipime POS</h1>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Usuario</label>
        <input
          id="username"
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-800 focus:border-blue-500 dark:focus:border-blue-400 outline-none dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500"
          required
          autocomplete="username"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
        <input
          id="password"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-800 focus:border-blue-500 dark:focus:border-blue-400 outline-none dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500"
          required
          autocomplete="current-password"
        />
      </div>

      @if (loginError(); as err) {
        <app-error-alert [message]="err" />
      }

      <button
        type="submit"
        class="w-full bg-blue-600 dark:bg-blue-500 text-white rounded px-4 py-2 font-medium hover:bg-blue-700 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          Ingresando…
        } @else {
          <span class="inline-flex items-center gap-1.5">
            <span class="material-symbols-outlined leading-none text-sm">login</span>
            Iniciar sesión
          </span>
        }
      </button>
    </form>
  </div>
</div>

@if (showReopenModal()) {
  <div
    class="fixed inset-0 z-50 flex cursor-pointer items-center justify-center bg-black/40"
    role="dialog"
    tabindex="-1"
    (click)="onCloseReopenBackdrop($event)"
    (keydown)="onCloseReopenKeydown($event)"
  >
    <div class="mx-4 w-full max-w-md rounded-xl bg-white dark:bg-gray-900 p-6 shadow-xl dark:shadow-gray-950/80">
      <h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-gray-100">Jornada del día</h3>

      @if (cerrarError()) {
        <div class="mb-4 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 px-4 py-3 text-sm text-red-700 dark:text-red-400">
          {{ cerrarError() }}
        </div>
      }

      <p class="mb-6 text-gray-600 dark:text-gray-400">
        Hay una jornada abierta de hoy. ¿Qué deseas hacer?
      </p>

      <div class="flex gap-3">
        <button
          type="button"
          class="flex-1 cursor-pointer rounded-lg bg-green-600 dark:bg-green-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-700 dark:hover:bg-green-600 active:bg-green-800 dark:active:bg-green-700 transition-colors"
          [disabled]="cerrando()"
          (click)="reabrirJornada()"
        >
          <span class="inline-flex items-center gap-1.5">
            <span class="material-symbols-outlined leading-none text-sm">refresh</span>
            Reabrir jornada
          </span>
        </button>
        <button
          type="button"
          class="flex-1 cursor-pointer rounded-lg bg-red-600 dark:bg-red-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700 dark:hover:bg-red-600 active:bg-red-800 dark:active:bg-red-700 transition-colors disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="cerrando()"
          (click)="cerrarYGuardar()"
        >
          @if (cerrando()) {
            <span class="inline-flex items-center gap-2">
              <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
              Cerrando...
            </span>
          } @else {
            <span class="inline-flex items-center gap-1.5">
              <span class="material-symbols-outlined leading-none text-sm">download</span>
              Cerrar y guardar
            </span>
          }
        </button>
      </div>
    </div>
  </div>
}
