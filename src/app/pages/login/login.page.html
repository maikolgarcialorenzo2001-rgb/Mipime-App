<div class="flex items-center justify-center min-h-screen bg-gray-50 dark:bg-gray-950">
  <div class="w-full max-w-sm bg-white dark:bg-gray-900 rounded-lg shadow-md dark:shadow-xl p-8">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-900 dark:text-gray-100">Mipime POS</h1>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Usuario</label>
        <input
          id="username"
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-800 focus:border-blue-500 dark:focus:border-blue-400 outline-none dark:border-gray-600"
          required
          autocomplete="username"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
        <input
          id="password"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-800 focus:border-blue-500 dark:focus:border-blue-400 outline-none dark:border-gray-600"
          required
          autocomplete="current-password"
        />
      </div>

      @if (loginError(); as err) {
        <app-error-alert [message]="err" />
      }

      <button
        type="submit"
        class="w-full bg-blue-600 dark:bg-blue-500 text-white rounded px-4 py-2 font-medium hover:bg-blue-700 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          Ingresando…
        } @else {
          <span class="inline-flex items-center gap-1.5">
            <span class="material-symbols-outlined leading-none text-sm">login</span>
            Iniciar sesión
          </span>
        }
      </button>
    </form>
  </div>
</div>
