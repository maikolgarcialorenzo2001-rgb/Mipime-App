@if (auth.isLoggedIn()) {
  <nav class="fixed top-0 left-0 right-0 z-50 border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-1 py-3">
      <span class="text-lg font-bold text-gray-900">Mipime-App</span>

      <div class="flex items-center gap-4 text-sm font-medium">
        <a
          routerLink="/pos"
          routerLinkActive #pos="routerLinkActive"
          [class.text-blue-600]="pos.isActive"
          [class.font-semibold]="pos.isActive"
          [class.underline]="pos.isActive"
          class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
        >
          POS
        </a>
        <a
          routerLink="/productos"
          routerLinkActive #productos="routerLinkActive"
          [class.text-blue-600]="productos.isActive"
          [class.font-semibold]="productos.isActive"
          [class.underline]="productos.isActive"
          class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
        >
          Productos
        </a>
        <a
          routerLink="/jornada"
          routerLinkActive #jornada="routerLinkActive"
          [class.text-blue-600]="jornada.isActive"
          [class.font-semibold]="jornada.isActive"
          [class.underline]="jornada.isActive"
          class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
        >
          Jornada
        </a>
        <a
          routerLink="/inventario"
          routerLinkActive #inventario="routerLinkActive"
          [class.text-blue-600]="inventario.isActive"
          [class.font-semibold]="inventario.isActive"
          [class.underline]="inventario.isActive"
          class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
        >
          Inventario
        </a>
        <a
          routerLink="/historial"
          routerLinkActive #historial="routerLinkActive"
          [class.text-blue-600]="historial.isActive"
          [class.font-semibold]="historial.isActive"
          [class.underline]="historial.isActive"
          class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
        >
          Historial
        </a>
        @if (auth.hasRole('admin')) {
          <a
            routerLink="/admin"
            routerLinkActive #admin="routerLinkActive"
            [class.text-blue-600]="admin.isActive"
            [class.font-semibold]="admin.isActive"
            [class.underline]="admin.isActive"
            class="text-gray-600 hover:text-blue-600 transition-colors cursor-pointer underline-offset-4 decoration-gray-400 decoration-2"
          >
            Admin
          </a>
        }
      </div>

      <div class="flex items-center gap-3 text-sm">
        <span class="text-gray-500">{{ auth.usuario()?.nombre }}</span>
        <button
          (click)="logout()"
          class="text-red-600 hover:text-red-800 transition-colors cursor-pointer"
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>
}
