<li class="flex items-center gap-2 sm:gap-3 py-3">
  <div class="flex-1 min-w-0">
    <p class="truncate text-sm font-medium text-gray-900 dark:text-gray-100">{{ item().producto.nombre }}</p>
    <p class="text-xs text-gray-400 dark:text-gray-500">{{ item().producto.precio_venta | pesos:'1.0-0' }} {{ etiquetaPrecio(item()) }}</p>
  </div>

  <div class="flex items-center gap-1">
    <button
      type="button"
      class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 active:bg-gray-200 dark:active:bg-gray-700 active:scale-95 transition-all touch-manipulation"
      (click)="cantidadReducir.emit()"
      aria-label="Reducir cantidad"
    >
      <span class="material-symbols-outlined leading-none text-base">remove</span>
    </button>

    <span class="w-8 text-center text-sm font-semibold tabular-nums dark:text-gray-200">{{ item().cantidad }}</span>

    <button
      type="button"
      class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 active:bg-gray-200 dark:active:bg-gray-700 active:scale-95 transition-all touch-manipulation"
      (click)="cantidadAumentar.emit()"
      aria-label="Aumentar cantidad"
    >
      <span class="material-symbols-outlined leading-none text-base">add</span>
    </button>
  </div>

  <span class="w-20 text-right text-sm font-semibold tabular-nums text-gray-900 dark:text-gray-100">
    {{ item().subtotal | pesos:'1.0-0' }}
  </span>

  <button
    type="button"
    class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full text-gray-300 dark:text-gray-600 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-500 dark:hover:text-red-400 active:bg-red-100 dark:active:bg-red-900/50 active:scale-95 transition-all touch-manipulation"
    (click)="quitar.emit()"
    aria-label="Quitar del carrito"
  >
    <span class="material-symbols-outlined leading-none text-base">close</span>
  </button>
</li>
