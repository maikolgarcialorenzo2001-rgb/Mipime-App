<div class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gray-950">
  <div class="text-center px-6">
    <h2 class="text-sm font-medium uppercase tracking-widest text-gray-400 dark:text-gray-500 mb-2">Mipime-Cuentas</h2>
    <span class="material-symbols-outlined text-6xl leading-none text-gray-300 dark:text-gray-700 mb-6 block">timer_off</span>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-3">Versión de prueba expirada</h1>
    @if (expiryDate()) {
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">La acceso finalizó el {{ expiryDate() }}</p>
    }
    <p class="text-gray-600 dark:text-gray-400 max-w-md mx-auto">
      Por favor, contacta al desarrollador para obtener una nueva versión.
    </p>
  </div>
</div>
