<button
  type="button"
  class="flex h-full w-full cursor-pointer flex-col justify-between rounded-xl border-2 p-4 text-left transition-all hover:shadow-md active:scale-[0.97]"
  [ngClass]="selected()
    ? 'border-blue-500 bg-blue-50 shadow-sm'
    : 'border-gray-200 bg-white hover:border-gray-300'"
  (click)="clicked.emit()"
>
  <span class="text-sm font-medium text-gray-900 leading-tight line-clamp-2">{{ producto().nombre }}</span>
  <div class="mt-2">
    <span class="text-lg font-semibold text-blue-600">
      {{ producto().precio_venta | currency:'ARS':'symbol-narrow':'1.0-0' }}
    </span>
    <span
      class="mt-1 block text-xs"
      [class.text-green-400]="producto().stock_actual > 10"
      [class.text-orange-400]="producto().stock_actual >= 1 && producto().stock_actual <= 10"
      [class.text-red-500]="producto().stock_actual === 0"
    >
      Stock: {{ producto().stock_actual }}
    </span>
  </div>
</button>
