<div class="rounded-xl bg-white dark:bg-gray-900 p-6 shadow-lg dark:shadow-gray-950/50">
  <div class="flex items-center gap-3 mb-4">
    <app-estado-badge [estado]="jornada().estado" />
    <span class="text-sm text-gray-500 dark:text-gray-400">
      {{ jornada().fecha | date }}
    </span>
  </div>

  <dl class="grid grid-cols-2 gap-4">
    <div>
      <dt class="text-sm text-gray-500 dark:text-gray-400">Monto inicial</dt>
      <dd class="text-lg font-semibold text-gray-900 dark:text-gray-100">${{ jornada().monto_inicial }}</dd>
    </div>
    @if (isAdmin()) {
      <div>
        <dt class="text-sm text-gray-500 dark:text-gray-400">Total ventas</dt>
        <dd class="text-lg font-semibold text-gray-900 dark:text-gray-100">${{ jornada().total_ventas }}</dd>
      </div>
    }
    <div>
      <dt class="text-sm text-gray-500 dark:text-gray-400">Total gastos</dt>
      <dd class="text-lg font-semibold text-red-600 dark:text-red-400">${{ totalGastos() ?? 0 }}</dd>
    </div>
    @if (jornada().total_merma > 0) {
      <div>
        <dt class="text-sm text-gray-500 dark:text-gray-400">Total mermas</dt>
        <dd class="text-lg font-semibold text-red-600 dark:text-red-400">${{ jornada().total_merma }}</dd>
      </div>
    }
    <div>
      <dt class="text-sm text-gray-500 dark:text-gray-400">Saldo en caja</dt>
      <dd class="text-lg font-semibold text-gray-900 dark:text-gray-100">${{ jornada().saldo_esperado }}</dd>
    </div>
  </dl>
</div>
