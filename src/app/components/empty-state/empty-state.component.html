<div class="flex flex-col items-center justify-center gap-3 py-20 text-center text-gray-400 dark:text-gray-500">
  <span class="material-symbols-outlined text-5xl leading-none" aria-hidden="true">{{ icon() }}</span>
  <p class="text-lg">{{ message() }}</p>
  @if (accion(); as label) {
    <button
      type="button"
      class="mt-1 cursor-pointer rounded-lg bg-blue-600 dark:bg-blue-500 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors"
      (click)="accionClick.emit()"
    >
      {{ label }}
    </button>
  }
</div>
