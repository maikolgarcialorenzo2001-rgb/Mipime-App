<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  data-backdrop
  (click)="onBackdropClick($event)"
>
  <div
    class="mx-4 w-full max-w-xs rounded-xl bg-white p-6 shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <p class="mb-1 text-sm font-medium text-gray-900 truncate">{{ producto().nombre }}</p>
    <p class="mb-4 text-xs text-gray-400">{{ producto().precio_venta | currency:'ARS':'symbol-narrow':'1.0-0' }} c/u</p>

    <input
      #qtyInput
      type="text"
      inputmode="numeric"
      [value]="cantidad()"
      (input)="cantidad.set(+$any($event.target).value || 1)"
      (keydown)="onInputKeydown($event)"
      class="mb-4 w-full rounded-lg border-2 border-gray-300 px-4 py-3 text-center text-2xl font-semibold focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-colors"
    />

    @if (soloNumeros()) {
      <p class="-mt-3 mb-4 text-xs text-red-500 text-center animate-pulse">
        Solo se permiten números
      </p>
    }

    <div class="flex gap-3">
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
        (click)="cancelar.emit()"
      >
        <span class="inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined leading-none text-sm">close</span>
          Cancelar
        </span>
      </button>
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 active:bg-blue-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="cantidad() < 1"
        (click)="confirmar.emit(cantidad())"
      >
        <span class="inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined leading-none text-sm">add_shopping_cart</span>
          Agregar
        </span>
      </button>
    </div>
  </div>
</div>
