<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  data-backdrop
  role="dialog"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div
    class="w-full max-w-xs rounded-xl bg-white dark:bg-gray-900 p-5 shadow-xl dark:shadow-gray-950/80"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <p class="mb-1 text-sm font-medium text-gray-900 dark:text-gray-100 truncate">{{ producto().nombre }}</p>
    <p class="mb-3 text-xs text-gray-400 dark:text-gray-500">{{ producto().precio_venta | currency:'ARS':'symbol-narrow':'1.0-0' }} c/u</p>

    <input
      #qtyInput
      type="text"
      inputmode="numeric"
      [value]="cantidad()"
      (input)="cantidad.set(+$any($event.target).value || 1)"
      (keydown)="onInputKeydown($event)"
      class="mb-3 w-full rounded-lg border-2 border-gray-300 dark:border-gray-600 px-4 py-3 text-center text-2xl font-semibold text-gray-700 dark:text-gray-300 focus:border-blue-500 dark:focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 transition-colors dark:bg-gray-900 placeholder-gray-400 dark:placeholder-gray-500 touch-manipulation"
    />

    @if (soloNumeros()) {
      <p class="-mt-2 mb-3 text-xs text-red-500 dark:text-red-400 text-center animate-pulse">
        Solo se permiten números
      </p>
    }

    <div class="flex gap-3">
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 active:bg-gray-100 dark:active:bg-gray-700 active:scale-[0.98] transition-all touch-manipulation min-h-[48px]"
        (click)="cancelar.emit()"
      >
        <span class="inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined leading-none text-sm">close</span>
          Cancelar
        </span>
      </button>
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg bg-blue-600 dark:bg-blue-500 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 dark:hover:bg-blue-600 active:bg-blue-800 dark:active:bg-blue-700 active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed touch-manipulation min-h-[48px]"
        [disabled]="cantidad() < 1"
        (click)="confirmar.emit(cantidad())"
      >
        <span class="inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined leading-none text-sm">add_shopping_cart</span>
          Agregar
        </span>
      </button>
    </div>
  </div>
</div>
