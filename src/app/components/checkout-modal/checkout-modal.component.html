<div
  class="fixed inset-0 z-50 flex cursor-pointer items-center justify-center bg-black/40"
  role="dialog"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div
    class="mx-4 w-full max-w-md rounded-xl bg-white p-6 shadow-xl"
  >
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Confirmar venta</h3>

    @if (errorMessage(); as msg) {
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        {{ msg }}
      </div>
    }

    <ul class="mb-4 divide-y divide-gray-100 text-sm">
      @for (item of items(); track item.producto.id) {
        <li class="flex justify-between py-2">
          <span class="text-gray-600 truncate mr-2">{{ item.cantidad }}× {{ item.producto.nombre }}</span>
          <span class="font-medium text-gray-900 tabular-nums">
            {{ item.subtotal | currency:'ARS':'symbol-narrow':'1.0-0' }}
          </span>
        </li>
      }
    </ul>

    <div class="mb-6 flex items-baseline justify-between border-t border-gray-200 pt-3">
      <span class="text-base font-semibold text-gray-900">Total</span>
      <span class="text-xl font-semibold text-gray-900">
        {{ total() | currency:'ARS':'symbol-narrow':'1.0-0' }}
      </span>
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
        (click)="cancelar.emit()"
      >Cancelar</button>
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-lg bg-green-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-700 active:bg-green-800 transition-colors"
        (click)="confirmar.emit()"
      >Confirmar venta</button>
    </div>
  </div>
</div>
