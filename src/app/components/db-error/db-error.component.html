<div class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gray-950">
  <div class="max-w-lg w-full mx-4 text-center px-6 py-10">
    <h2 class="text-sm font-medium uppercase tracking-widest text-gray-400 dark:text-gray-500 mb-2">Mipime-Cuentas</h2>
    <span class="material-symbols-outlined text-6xl leading-none text-red-500 mb-6 block">error</span>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-3">Error crítico en la base de datos</h1>
    <p class="text-gray-600 dark:text-gray-400 max-w-md mx-auto mb-6">
      La base de datos no se pudo abrir ni recuperar. Contacte al desarrollador para recuperar sus datos.
    </p>
    @if (diagnostics(); as diag) {
      <div class="text-left bg-gray-100 dark:bg-gray-900 rounded-lg p-4 mb-6 max-h-48 overflow-auto">
        <pre class="text-xs font-mono text-gray-700 dark:text-gray-300 whitespace-pre-wrap break-all">{{ diagnosticsText() }}</pre>
      </div>
      <button
        type="button"
        (click)="copiarDiagnostico()"
        class="cursor-pointer rounded-lg bg-red-600 dark:bg-red-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700 dark:hover:bg-red-600 active:bg-red-800 dark:active:bg-red-700 transition-colors disabled:cursor-not-allowed disabled:opacity-50"
      >
        Copiar diagnóstico
      </button>
    }
  </div>
</div>
