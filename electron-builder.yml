# electron-builder configuration
# Docs: https://www.electron.build/configuration/configuration

# NOTE (build metadata gotcha): if package.json version contains semver build
# metadata like "0.1.21+Palmar", electron-builder TRUNCATES the "+Palmar" part
# in generated artifacts (installer file name, blockmap name, latest.yml
# version/url). The app UI keeps the full version, but the artifacts do not.
# After building a "+" version, rename the installer + blockmap and patch
# latest.yml manually. `scripts/build-version-check.mjs` prints this warning
# automatically on every `electron:build:win` run.

appId: com.mipime.cuentas
productName: Tienda - App
copyright: Copyright © 2026 Mipime

directories:
  output: release

# Compiled Electron sources (tsc output)
# NOTE: dist-electron/**/* (not a per-file list) so new main-process files
# (e.g. export-name.ts) are always packaged. A whitelist that forgets one file
# breaks the app at runtime with "Cannot find module './<file>'".
files:
  - dist-electron/**/*
  - dist/Mipime-Cuentas/browser/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"

# better-sqlite3 ships prebuilt N-API binaries (ABI stable Node<->Electron),
# so the node-gyp rebuild step (which requires Python) is unnecessary.
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tienda - App

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance
  hardenedRuntime: true

dmg:
  title: Tienda - App

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Finance
  icon: build/icon.png

# Deb (FPM) metadata. FPM exige maintainer (con email) y url; si faltan,
# electron-builder falla con "Please specify project homepage" / "authorEmailIsMissed".
deb:
  maintainer: Enjin2310 <Rodriguez.Lorenzo@spikersoft.com>
  vendor: Mipime
  synopsis: Tienda - App (Mipime-Cuentas)
  priority: optional

# Publish configuration for electron-updater
publish:
  provider: github
  owner: maikolgarcialorenzo2001-rgb
  repo: Mipime-App
  releaseType: draft
